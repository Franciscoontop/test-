<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoltTech - Premium Electrician Services</title>
    <!-- Modern, sleek typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- 
      ANIMATION CONTAINER
      This holds the mockup GSAP SVG wire. 
      When you're ready to use your custom video, uncomment the video tag below.
    -->
    <div id="animation-container">
      <!-- MOCKUP SVG WIRE -->
      <svg id="wire-svg" viewBox="0 0 100 1000" preserveAspectRatio="none">
        <path id="wire-path" class="wire-path" d="M 50 0 L 50 300 Q 50 350 80 400 T 50 500 L 50 1000" />
      </svg>
      <!-- SPARK EFFECT ELEMENT -->
      <div id="spark" class="spark"></div>

      <!-- 
        CUSTOM VIDEO PLACEHOLDER 
        Uncomment this and point src to your video file in the /public folder!
        <video id="user-video-placeholder" src="/your-animation.mp4" muted playsinline></video>
      -->
    </div>

    <!-- PAGE CONTENT (Scrollable overlay) -->
    <main>
      <section class="hero">
        <div class="content">
          <h1>VoltTech</h1>
          <p>Next-Generation Electrical Solutions.</p>
        </div>
      </section>

      <section class="services">
        <div class="content">
          <h2>Precision. Safety. Power.</h2>
          <p>Scroll down to cut the circuit.</p>
        </div>
      </section>

      <section class="contact">
        <div class="content">
          <h2>Circuit Severed.</h2>
          <p>Ready to upgrade your system?</p>
          <button class="cta-btn">Get a Quote</button>
        </div>
      </section>
    </main>

    <script type="module" src="/main.js"></script>
  </body>
</html>
